<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Arpusのおもちゃ箱</title>
    <link rel="stylesheet" href="index_style.css">
</head>
<body>
    <h1>Arpusのおもちゃ箱</h1>

    <h2>K-Shoot MANIA Packages</h2>
    <ul>
        <li><a href="https://drive.google.com/drive/folders/1jUC1MET1L1Rfae15q8s1EMYnsXoVO6xW?usp=drive_link">WAYANIOriginal</a></li>
        <li><a href="./Package002/Package002.html">Package002(いつか作るかも)</a></li>
        <li><a href="./Package003/Package003.html">Package003(いつか作るかも)</a></li>
    </ul>

    <h2>K-Shoot MANIA Tools</h2>
    <li><a href="./kshTools/kshTools.html">kshTools</a></li>
    <div id="tool-list">ツール一覧を読み込み中…</div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ★ フェッチ先をサブフォルダ内に変更
            fetch('kshTools/kshTools.html')
                .then(res => res.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const tools = doc.querySelector('#tool-list');
                    if (tools) {
                        const container = document.getElementById('tool-list');
                        container.innerHTML = tools.innerHTML;
                        // リンクを index.html から参照できるように補正
                        container.querySelectorAll('a').forEach(a => {
                            const href = a.getAttribute('href');
                            // "./foo/bar" → "kshTools/foo/bar"
                            a.setAttribute('href', href.replace(/^\.\//, 'kshTools/'));
                        });
                    } else {
                        console.error('ツール一覧要素が見つかりません');
                    }
                })
                .catch(err => {
                    console.error('ツール一覧の読み込みに失敗しました', err);
                    document.getElementById('tool-list').textContent = 'ツール一覧の読み込みに失敗しました';
                });
        });
    </script>

    <h2>Minecraft Tools</h2>
    <ul>
        <li><a href="./mcTools/Translate/Translate.html">(たぶん作らない)</a></li>
    </ul>

    <footer></footer>
</body>
</html>
