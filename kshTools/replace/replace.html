<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ksh Replace Tool</title>
    <link rel="stylesheet" href="replace_style.css">
</head>
<body>
    <h1>ksh Replace Tool</h1>
	<p>kshファイル内の文字列を一括置換します。</p>
	<p>元のファイルを変更せず、複数の置換を一度に行うことができます</p>
    <!-- ドロップ＆クリック選択エリア -->
    <div id="dropArea">.kshファイルをここにドロップ、またはクリックして選択<br>Drop your .ksh file here, or click to select</div>
    <input type="file" id="fileInput" accept=".ksh" style="display:none">
    <div id="fileName"></div>

    <!-- プレビュー（先頭10行） -->
    <textarea id="textArea" readonly placeholder="プレビュー Preview"></textarea>

    <!-- 置換ルール群 -->
	<p>左に探す文字列を、右に置換先の文字列を入れてください。右側を空白にすると削除されます。</p>
    <div id="rules">
        <div class="rule">
            <textarea class="search" placeholder="検索文字列 Search pattern"></textarea>
            <textarea class="replace" placeholder="置換文字列 Replacement pattern"></textarea>
            <button type="button" class="remove-rule">−</button>
        </div>
    </div>
    <p>
        <button type="button" id="add-rule">ルールを追加＋</button>
    </p>

    <!-- 実行ボタン -->
    <p>
        <button type="button" id="replace-btn">実行</button>
    </p>
	<h3>注意</h3>
	<p>意図しない部分を巻き込まないよう注意してください。</p>
	<p>改行を含む置換を行う場合、Enterキーで直接改行を入力してください。</p>
	<p>行を削除したい場合は文字列の末尾に改行を入れ忘れないようにしてください。</p>

    <!-- 戻るボタン -->
    <footer>
        <button type="button" onclick="history.back()">back</button>
    </footer>

    <script src="replace_script.js"></script>
</body>
</html>
